name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Installer rsync 3 et rclone
        run: brew install rsync rclone
      - name: Tests
        run: swift test
        env:
          SYNCMACPRO_RSYNC: /opt/homebrew/bin/rsync
